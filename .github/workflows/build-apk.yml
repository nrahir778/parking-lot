name: Build Native Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Node Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web Application
      run: npm run build --if-present

    - name: Sync Capacitor Android Project
      run: npx cap sync android || true

    - name: Generate Custom Icons
      run: |
        npm run icons:generate || true

    - name: Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Enable AndroidX Flags Automatically
      run: |
        if [ -d "android" ]; then
          cd android
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
        elif [ -f "gradle.properties" ]; then
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
        fi

    - name: Ensure Persistent Keystore Exists
      run: |
        if [ ! -f "android/app/debug.keystore" ]; then
          echo "debug.keystore not found, creating persistent keystore..."
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/key.pem -out /tmp/cert.pem -days 10000 -nodes -subj "/CN=Android Debug/O=Android/C=US"
          openssl pkcs12 -export -in /tmp/cert.pem -inkey /tmp/key.pem -out android/app/debug.keystore -name androiddebugkey -password pass:android
          rm -f /tmp/key.pem /tmp/cert.pem
        else
          echo "Persistent debug.keystore found in android/app/debug.keystore (Consistent signing signature enabled)."
        fi

    - name: Grant Execute Permission for Gradle Wrapper
      run: |
        GRADLEW_PATH=$(find . -name gradlew -print -quit)
        if [ -n "$GRADLEW_PATH" ]; then
          chmod +x "$GRADLEW_PATH"
        fi

    - name: Build Debug APK
      run: |
        GRADLEW_PATH=$(find . -name gradlew -print -quit)
        GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
        cd "$GRADLEW_DIR"
        chmod +x ./gradlew
        bash ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: parking-lot-apk
        path: |
          **/build/outputs/apk/debug/*.apk
