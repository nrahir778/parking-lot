name: Build Native Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22' # 👈 Bypasses the strict caching check causing your current error

    - name: Install Node Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web Application
      run: npm run build --if-present

    - name: Sync Capacitor Android Project
      run: npx cap sync android || true

    - name: Install Asset Tools
      run: npm install @capacitor/assets --save-dev --legacy-peer-deps

    - name: Generate Icon Assets
      run: npx @capacitor/assets generate --android

    - name: Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Enable AndroidX Flags Automatically
      run: |
        if [ -d "android" ]; then
          cd android
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
        elif [ -f "gradle.properties" ]; then
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
        fi

    - name: Grant Execute Permission for Gradle Wrapper
      run: |
        GRADLEW_PATH=$(find . -name gradlew -print -quit)
        if [ -n "$GRADLEW_PATH" ]; then
          chmod +x "$GRADLEW_PATH"
        fi

    - name: Build Debug APK
      run: |
        GRADLEW_PATH=$(find . -name gradlew -print -quit)
        GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
        cd "$GRADLEW_DIR"
        chmod +x ./gradlew
        bash ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: parking-lot-apk
        path: |
          **/build/outputs/apk/debug/*.apk
